name: Backend Build & Test

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-build.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-build.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore backend/GeoSampleExplorer.sln

      - name: Build
        run: dotnet build backend/GeoSampleExplorer.sln --no-restore -c Release

      - name: Test
        run: dotnet test backend/GeoSampleExplorer.sln --no-build -c Release --verbosity normal
